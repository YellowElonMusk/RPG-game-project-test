# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Systems Design

modes:
  rigor: standard
  # Explicit: the remaining stories were written at full rigor with one AC each.
  story_granularity: fine
  automation: autonomous

engine:
  name: "Godot"
  version: "4.7.2"
  language: "GDScript"
  rendering: "Forward+"
  physics: "Jolt"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  build: "[TO BE CONFIGURED]"   # no export presets yet — create one in the editor, then set via /settings
  # `godot` must be on PATH (Godot 4.7.2). See README.md, "Running it".
  test: "godot --headless -s -d --remote-debug tcp://127.0.0.1:0 res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode"
  run: "godot --path . --windowed --resolution 1280x720"
  smoke: "godot --headless --quit-after 5"

platform:
  # 2026-10-22, user decision. Vulkan is required on every target (no D3D12
  # fallback); Steam Deck runs SteamOS (Linux) at 1280x800 (16:10).
  targets: ["Windows", "Linux/SteamOS (Steam Deck, native Linux export)"]
  rendering_backend: "Vulkan (required, no fallback)"
  min_spec: "GTX 1080-class desktop GPU, 8 GB system RAM; Steam Deck must run smoothly"

performance:
  target_framerate: 60
  frame_budget_ms: 16.6
  # 2026-10-22, user accepted the technical director's proposal (ADR-0005 review 6):
  # battle = 300 3D draw calls (incl. SetLight cascades) + 100 canvas/HUD.
  draw_call_limit: 400
  frame_time_p99_ms: 16.6
  frame_time_worst_ms: 33
  # 2026-10-23, user accepted the technical director's proposal (Overworld GDD OQ-19,
  # ADR-0012 TD-ADR review): per-system p99 shares of frame_budget_ms.
  per_system:
    overworld_ms: 2.0   # symbol stepping + notice searches + repaths, p99 (GDD AC-46)

testing:
  framework: "gdUnit4"

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.
