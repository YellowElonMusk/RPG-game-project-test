# ─── CONSTANTS ───────────────────────────────────────────────────────────────
  - name: chase_visibility
    status: active
    source: design/gdd/overworld-exploration-encounters.md
    referenced_by:
      - design/gdd/overworld-exploration-encounters.md
      - design/gdd/sprite-camera-presentation.md   # binds the overworld follow_camera's h / pitch / F_v / dz / tau (Overworld OQ-1)
    variables:
      - symbol_chase_m
      - body_radius
      - walk_speed
      - v_patrol
      - see_lead_s
      - a_near
      - a_far
      - w_far
      - F_v_eff
      - F_h
      - h
      - pitch
      - dz_x
      - dz_y
      - tau
      - f_patrol
      - H_max
      - dof_near_end
      - dof_far_begin
      - d_cam
    output_range: [pass, fail]   # load-time validation (invariant I14) at 4:3, 16:9 and 21:9
    expression: "see_m = symbol_chase_m + body_radius + (walk_speed + v_patrol) * see_lead_s; R_e = dist_e - (|n_e.x| * dz_x + |n_e.y| * dz_y) - walk_speed * tau for e in {near, far, side}; R_vis = min(R_e); s_blur = see_m + dz_y + walk_speed * tau; valid iff R_vis >= see_m at 4:3, 16:9 and 21:9 and dof_near_end <= d_cam(-s_blur) - H_max * sin(pitch) and dof_far_begin >= d_cam(+s_blur); d_cam = view-space depth"
    notes: "A patrolling Compliance Clerk must be on screen before the leader can reach its notice radius. Per-edge form (rev 2, design review 2026-10-23). At presentation's example camera (pitch 30 deg, F_v 20 deg) this needs h >= 10.9 m at default dz/tau and h >= 11.6 m at their ceilings; 12.0 m proposed (Overworld OQ-1, owner Presentation). No sprite DOF exemption: blur bounds, measured from the leader (rev 3), keep see_m sharp. see_lead_s narrowed to 0.2-0.3 (rev 3): at h 12 m it may be at most about 0.34."
    added: 2026-10-23
    revised: 2026-10-23
  - name: occupation_stage
    status: active
    source: design/gdd/overworld-exploration-encounters.md
    referenced_by:
      - design/gdd/overworld-exploration-encounters.md
      - design/art/art-bible.md                      # occupation gradient (stages 1-3) and stage lighting
      - design/gdd/sprite-camera-presentation.md     # faction x stage lighting profile (settles its OQ 6)
    variables:
      - base_stage
      - stage_table
      - flags
      - stage_stored
    output_range: [1, 3]   # 1 Contested, 2 Occupied, 3 Saturated; never decreases; maps without base_stage have no stage
    expression: "stage_new = clamp(max({base_stage} union {s : (f, s) in stage_table, f in flags}), 1, 3); stage = max(stage_new, stage_stored); computed only on map load"
    notes: "Raised only on the faction's schedule (ChapterFlow step changes, never a player Victory or map entry) and only before any step in which the raised map can be loaded, so the player never sees it at the lower stage (rev 3-4, Pillar 2); reachable stages are derived from the ChapterFlow step list; player victories clear clutter locally (liberated markers) but never change the stage. After region liberation a presentation override restores golden hour (rule 17) while the stage value stays. Paris (rev 4): Town 1; overworld segment base 1, always first loaded at 2 (permits_mandatory set on the chapter opening step); dungeon 3; Town stages 2-3 and segment stage 1 not authored in MVP."
    added: 2026-10-23
    revised: 2026-10-23
  - name: intensity_tier
    status: active
    source: design/gdd/beatbox-battle-score.md
    referenced_by:
      - design/gdd/beatbox-battle-score.md
    variables:
      - score_tier_override
      - score_base_tier
      - is_boss
      - boss_tier_bonus
      - tier_max
    output_range: [1, 4]
    expression: "score_tier_override if score_tier_override > 0 else clamp(score_base_tier + (boss_tier_bonus if is_boss else 0), 1, tier_max)"
    notes: "F1. Fixed at fight start from data, never RNG; it never changes mid-fight. Bureaucratia: street 1, story encounter 2 (override), Supervisor 3. Feeds score_bpm."
    added: 2026-10-29
    revised: ""
  - name: score_bpm
    status: active
    source: design/gdd/beatbox-battle-score.md
    referenced_by:
      - design/gdd/beatbox-battle-score.md
    variables:
      - tier_bpm
      - intensity_tier
    output_range: [92, 138]
    expression: "tier_bpm[intensity_tier], default [92, 108, 124, 138]"
    notes: "F3. Stems are authored at exactly these tempos; the score never time-stretches, and the replay speed-up latch never changes the tempo."
    added: 2026-10-29
    revised: ""

