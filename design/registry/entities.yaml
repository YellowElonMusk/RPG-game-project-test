# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_stat
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - stat
      - "Σstat_flat"   # was: stat_flat_sum before 2026-10-20
      - "Σstat_pct"    # was: stat_pct_sum before 2026-10-20
      - stat_eff_min
      - stat_eff_max
    output_range: [0, 199]
    expression: "clamp(floor((stat + Σstat_flat) * (1 + Σstat_pct)), stat_eff_min, stat_eff_max)"
    notes: "F2. stat_eff_min is 1 for attack, 0 otherwise. Sums are not clamped; only the result is. Only attack, defense, speed are modifiable at MVP."
    added: 2026-10-20
    revised: 2026-10-20
  - name: base_damage
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - power
      - power_scale
      - attack_eff
      - defense_eff
    output_range: [0.0005, 1990]
    expression: "(power / power_scale) * attack_eff^2 / (attack_eff + defense_eff)"
    notes: "F3, pipeline step 1. Never 0 for valid input. Equal attack and defense gives power/10 * attack/2."
    added: 2026-10-20
    revised: ""
  - name: base_heal
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - power
      - attack_eff
      - heal_attack_scale
    output_range: [1.02, 498]
    expression: "power * (1 + attack_eff / heal_attack_scale)"
    notes: "F4, pipeline step 1. Ignores target defense. Heals never draw from the RNG."
    added: 2026-10-20
    revised: ""
  - name: modified_amount
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - base
      - "Σflat"   # was: flat_sum before 2026-10-20
      - "Σpct"    # was: pct_sum before 2026-10-20
      - mult_min
      - mult_max
    output_range: [0, 8967]
    expression: "max(0, base + Σflat) * clamp(1 + Σpct, mult_min, mult_max)"
    notes: "F5, pipeline step 2. Flat before percent; percents add. Applies to damage and heal. Result clamped to amount cap in step 4."
    added: 2026-10-20
    revised: 2026-10-20
  - name: reward_totals
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - reward.xp
      - reward.money
    output_range: [0, 59994]
    expression: "sum of reward.xp and sum of reward.money over enemies KO'd in a won battle"
    notes: "F9. Upper bound assumes 6 enemies per battle (Turn Battle owns the real maximum). Loss or flee gives 0."
    added: 2026-10-20
    revised: ""
  - name: replay_time
    status: active
    source: design/gdd/sprite-camera-presentation.md
    referenced_by:
      - design/gdd/sprite-camera-presentation.md
      - docs/architecture/adr-0006-battle-replay-ownership.md   # implements it (§4, §6)
    variables:
      - w_i               # renamed 2026-10-22 (revision 4; was anim_i / t_impact_i): wind-up at 1x, from impact_frame
      - impact_frame      # added 2026-10-22 (revision 4)
      - beat_min
      - ff_mult
      - battle_speed_on   # renamed 2026-10-22 (revision 6; was battle_speed_2x): "Faster battle animations"
      - reaction_hold     # added 2026-10-21 (design-review revision 2)
      - ko_hold           # added 2026-10-22 (revision 4)
      - land_frame        # added 2026-10-22 (revision 6): knockout slump landing frame
      - k_i               # added 2026-10-22 (revision 6): slump time at 1x
      - battle_speed_mult # added 2026-10-21 (design-review revision 2); default 1.5 (revision 6)
      - latched           # revised 2026-10-22 (revision 5; was ff_level None/Plain/All): one latch level
      - speed_up_boss     # renamed 2026-10-22 (revision 6; was speed_up_all): "Speed up boss entrances"
      - dt_max            # added 2026-10-22 (revision 4)
      - blend_boss        # added 2026-10-22 (revision 4)
      - boss_hold         # added 2026-10-22 (revision 4)
      - boss_retry_hold   # added 2026-10-22 (revision 5): Retry settle
      # removed 2026-10-22 (revision 6, knockouts are plain beats): protected_i
      # removed 2026-10-22 (revision 5, automatic speed-up deferred): replay_cap, speed_auto_max, speed_max
    output_range: [1.0, 2.5]   # per-wind-up playback speed (1x to ff_mult max); holds are never scaled; wall_i = max(w_i / speed_i + hold_i, beat_min)
    expression: "w_i = Σ_{k < impact_frame} duration_k / fps; k_i = Σ_{k < land_frame} duration_k / fps (knockout animation); hold_i = 0 if no combatant reacts (Defend), max(ko_hold, max k_i over the beat's knockouts) if any knockout, else reaction_hold; speed_p = max(latched ? ff_mult : 1, battle_speed_on ? battle_speed_mult : 1); speed_i = debug ? 1 : speed_p; per frame (dt = min(step, dt_max)): wind-up progress += dt * speed_i, impact on the first frame progress >= w_i; post-impact clock += dt unscaled; beat ends on the first frame post >= hold_i and elapsed >= beat_min (padding extends the hold); leftover dt dropped at every event; takeover_full = (blend_boss + boss_hold) / (speed_up_boss ? speed_p : 1); takeover_settle (Retry) = boss_retry_hold / speed_p; press_effective = remaining wind-up, Retry settle, or (speed_up_boss) first-encounter takeover; debug path with no action animation: w_i = beat_min - reaction_hold at speed 1"
    notes: "Battle replay pacing per replay (one command's outcomes up to the next command menu; the boss takeover is a replay of its own), implemented by BattleReplayController (ADR-0006 revision 3). Only the wind-up and the takeover scale; holds (reaction_hold, the knockout hold) are unscaled mode time. beat_min floors the beat, with padding in the hold. Revision 6 (fifth design-review CD rulings 1-3): knockouts are plain beats whose wind-up speeds up like any other, holding until the slump lands and never less than ko_hold; only the first-encounter takeover is protected, sped only with 'Speed up boss entrances' on (then by speed_p, so Battle Speed applies with no press); a passive indicator state plus refusal feedback when press_effective is false; Cancel and the replay's end clear the latch; no automatic speed-up (GDD Open Question 16). Load validation, 1e-6 tolerance in the passing direction: battle_speed_mult <= ff_mult - 0.25; reaction_hold <= beat_min - 0.10; reaction_hold <= ko_hold; D < reaction_hold; dt_max < beat_min; boss_retry_hold <= blend_boss + boss_hold; blend_victory <= victory_hold; blend_defeat <= defeat_hold. ff_mult is a proposal pending Turn Battle ratification. Long replays run long, never cut."
    added: 2026-10-21
    revised: "2026-10-22"
  - name: flash_gate
    status: active
    source: design/gdd/sprite-camera-presentation.md
    referenced_by:
      - design/gdd/sprite-camera-presentation.md
      - design/gdd/game-state-scene-flow.md   # retry flash is gated
    variables:
      - flash_rate_max
      - flash_luma_delta
      - flash_area_min       # added 2026-10-21 (design-review revision 2)
      - t_req                # added 2026-10-22 (revision 6): request time
      - o                    # renamed 2026-10-22 (revision 7, was offset): declared transition offset on the source's own clock
      - c_now                # added 2026-10-22 (revision 7): the source clock's reading now
      - r                    # added 2026-10-22 (revision 7): the source clock's rate (0 frozen, 1, battle_speed_mult or ff_mult)
      - t_land               # added 2026-10-22 (revision 7): t_now + (o - c_now) / r, re-booked on every rate change
      - A_exempt             # added 2026-10-22 (revision 4): summed declared area of concurrent area-exempt effects
      # removed 2026-10-22 (revision 6, landing-time booking): t_last_flash, flash_rate_reduced
    output_range: [0, 3]   # flashes in any closed one-second window, counted at landing, global across all sources
    expression: "a gated request at real time t_req declaring transitions at offsets o on its own clock is allowed iff, with them booked at t_land = t_now + (o - c_now) / r, no closed one-second window holds more than flash_rate_max flashes (a booked transition counts as one flash if it opposes the booked transition before it); allowed -> book and play full, refused -> book nothing and play capped; t_land integrates over a known rate schedule (replay wind-up at speed, hold at 1x); any unscheduled rate change of a source clock (Menu freeze r = 0, resume, latch, speed setting, dt_max clamp) re-books its unlanded transitions (frozen ones count as pending at their resume-time landing); a closing transition (one that ends an already-landed opposite transition of the same source) is never dropped and re-books with reserved priority; if a re-booking would exceed the limit, only not-yet-started transitions are dropped and the source finishes in its capped variant; a capped variant has no general and no red transition, or covers < flash_area_min; reduce_flashing -> every gated request refused; reserved sources (boss flood) book unconditionally, each scripted reserved sequence boot-validated alone at 1x, max battle_speed_mult and max ff_mult; an area-exempt source starts exempt only if A_exempt + its declared area < flash_area_min, else it requests like a gated source; swing-exempt sources never request"
    notes: "Photosensitivity limit (WCAG 2.2 SC 2.3.1). A transition is a relative-luminance change >= flash_luma_delta (0.10) with the darker state below 0.80, or a saturated-red change (linear R/(R+G+B) >= 0.8, (R-G-B)*320 changing by > 20), covering >= flash_area_min (25%) of some 10-degree window ((4/9)H x (1/3)H px). Booking at landing time, not request time, so staggered requests cannot put four flashes in one second. Real time, so the Menu cannot reset the gate. The gate never delays a source (Game State's retry flash and wipes keep their timing). Covers the victory burst, the boss flood (reserved), attack and comedy VFX, and Game State's retry flash, wipes and fades. Campfire flicker must stay below flash_luma_delta and never counts. Load validation: flash_rate_max <= 3; flash_luma_delta = 0.10 and flash_area_min = 0.25 are constants."
    added: 2026-10-21
    revised: "2026-10-22"


