# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_stat
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - stat
      - "Σstat_flat"   # was: stat_flat_sum before 2026-10-20
      - "Σstat_pct"    # was: stat_pct_sum before 2026-10-20
      - stat_eff_min
      - stat_eff_max
    output_range: [0, 199]
    expression: "clamp(floor((stat + Σstat_flat) * (1 + Σstat_pct)), stat_eff_min, stat_eff_max)"
    notes: "F2. stat_eff_min is 1 for attack, 0 otherwise. Sums are not clamped; only the result is. Only attack, defense, speed are modifiable at MVP."
    added: 2026-10-20
    revised: 2026-10-20
  - name: base_damage
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - power
      - power_scale
      - attack_eff
      - defense_eff
    output_range: [0.0005, 1990]
    expression: "(power / power_scale) * attack_eff^2 / (attack_eff + defense_eff)"
    notes: "F3, pipeline step 1. Never 0 for valid input. Equal attack and defense gives power/10 * attack/2."
    added: 2026-10-20
    revised: ""
  - name: base_heal
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - power
      - attack_eff
      - heal_attack_scale
    output_range: [1.02, 498]
    expression: "power * (1 + attack_eff / heal_attack_scale)"
    notes: "F4, pipeline step 1. Ignores target defense. Heals never draw from the RNG."
    added: 2026-10-20
    revised: ""
  - name: modified_amount
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - base
      - "Σflat"   # was: flat_sum before 2026-10-20
      - "Σpct"    # was: pct_sum before 2026-10-20
      - mult_min
      - mult_max
    output_range: [0, 8967]
    expression: "max(0, base + Σflat) * clamp(1 + Σpct, mult_min, mult_max)"
    notes: "F5, pipeline step 2. Flat before percent; percents add. Applies to damage and heal. Result clamped to amount cap in step 4."
    added: 2026-10-20
    revised: 2026-10-20
  - name: reward_totals
    status: active
    source: design/gdd/stats-damage-resolution.md
    referenced_by:
      - design/gdd/stats-damage-resolution.md
    variables:
      - reward.xp
      - reward.money
    output_range: [0, 59994]
    expression: "sum of reward.xp and sum of reward.money over enemies KO'd in a won battle"
    notes: "F9. Upper bound assumes 6 enemies per battle (Turn Battle owns the real maximum). Loss or flee gives 0."
    added: 2026-10-20
    revised: ""
  - name: replay_time
    status: active
    source: design/gdd/sprite-camera-presentation.md
    referenced_by:
      - design/gdd/sprite-camera-presentation.md
      - docs/architecture/adr-0006-battle-replay-ownership.md   # implements it (§4, §6)
    variables:
      - w_i               # renamed 2026-10-22 (revision 4; was anim_i / t_impact_i): wind-up at 1x, from impact_frame
      - impact_frame      # added 2026-10-22 (revision 4)
      - beat_min
      - ff_mult
      - protected_i       # added 2026-10-21 (CD-GDD-ALIGN revision)
      - battle_speed_2x   # added 2026-10-21 (CD-GDD-ALIGN revision)
      - reaction_hold     # added 2026-10-21 (design-review revision 2)
      - ko_hold           # added 2026-10-22 (revision 4)
      - battle_speed_mult # added 2026-10-21 (design-review revision 2)
      - latched           # revised 2026-10-22 (revision 5; was ff_level None/Plain/All): one latch level
      - speed_up_all      # added 2026-10-22 (revision 5): "Speed up all replay beats" setting
      - dt_max            # added 2026-10-22 (revision 4)
      - blend_boss        # added 2026-10-22 (revision 4)
      - boss_hold         # added 2026-10-22 (revision 4)
      - boss_retry_hold   # added 2026-10-22 (revision 5): Retry settle
      # removed 2026-10-22 (revision 5, automatic speed-up deferred): replay_cap, speed_auto_max, speed_max
    output_range: [1.0, 2.5]   # per-wind-up playback speed (1x to ff_mult max); holds are never scaled; wall_i = max(w_i / speed_i + hold_i, beat_min)
    expression: "w_i = Σ_{k < impact_frame} duration_k / fps; hold_i = protected_i ? ko_hold : reaction_hold; speed_i = debug ? 1 : protected_i ? ((latched and speed_up_all) ? ff_mult : 1) : max(latched ? ff_mult : 1, battle_speed_2x ? battle_speed_mult : 1); per frame (dt = min(step, dt_max)): wind-up progress += dt * speed_i, impact on the first frame progress >= w_i; post-impact clock += dt unscaled; beat ends on the first frame post >= hold_i and elapsed >= beat_min (padding extends the hold); leftover dt dropped at every event; takeover_full = (blend_boss + boss_hold) / ((latched and speed_up_all) ? ff_mult : 1); takeover_settle (Retry) = boss_retry_hold / max(latched ? ff_mult : 1, battle_speed_2x ? battle_speed_mult : 1); debug path with no action animation: w_i = beat_min - reaction_hold at speed 1"
    notes: "Battle replay pacing per replay (one command's outcomes up to the next command menu; the boss takeover is a replay of its own), implemented by BattleReplayController (ADR-0006 revision 2). Only the wind-up and the Retry settle scale; holds (reaction_hold, ko_hold on knockouts) are unscaled mode time. beat_min floors the beat, with padding in the hold. Revision 5 (fourth design-review rulings): one latch level, where any press (confirm, fast_forward, indicator click) speeds plain beats only; knockouts and the first-encounter takeover are sped only when latched with speed_up_all on; Battle Speed never speeds protected beats; Cancel and the replay's end clear the latch; no automatic speed-up (GDD Open Question 16). Load validation, 1e-6 tolerance in the passing direction: battle_speed_mult <= ff_mult; reaction_hold <= beat_min - 0.10; reaction_hold <= ko_hold; D < reaction_hold; dt_max < beat_min; boss_retry_hold <= blend_boss + boss_hold; blend_victory <= victory_hold; blend_defeat <= defeat_hold. ff_mult is a proposal pending Turn Battle ratification. Long replays run long, never cut."
    added: 2026-10-21
    revised: "2026-10-22"
  - name: flash_gate
    status: active
    source: design/gdd/sprite-camera-presentation.md
    referenced_by:
      - design/gdd/sprite-camera-presentation.md
      - design/gdd/game-state-scene-flow.md   # retry flash is gated
    variables:
      - flash_rate_max
      - flash_luma_delta
      - t_last_flash
      - flash_rate_reduced   # added 2026-10-21 (design-review revision 2)
      - flash_area_min       # added 2026-10-21 (design-review revision 2)
      - A_exempt             # added 2026-10-22 (revision 4): summed declared area of concurrent area-exempt effects
    output_range: [0, 3]   # flashes in any closed one-second window, global across all sources
    expression: "allowed = (t_now - t_last_flash) > 1 / flash_rate_eff  (strict; real time; t_last_flash starts at -inf); flash_rate_eff = reduce_flashing ? flash_rate_reduced : flash_rate_max; an area-exempt effect starts exempt only if A_exempt + its declared area < flash_area_min, else it requests the gate"
    notes: "Photosensitivity limit. A flash is a swing >= flash_luma_delta over >= flash_area_min (25% of any 10-degree window), or a saturated-red transition. Covers every large-area luminance source: the victory burst, the boss flood, attack and comedy VFX, and Game State's retry flash, wipes and fades. A gated full variant holds at most one flash pair; a refused source plays its capped variant below flash_luma_delta; Reduce Flashing forces every gated source to its capped variant. Campfire flicker must stay below flash_luma_delta and never counts."
    added: 2026-10-21
    revised: "2026-10-22"


