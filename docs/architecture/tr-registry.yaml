  system: overworld
  gdd: design/gdd/overworld-exploration-encounters.md
  requirement: "An injected WorldState is the single owner of map, position and facing (written every frame) and of state that outlives a visit (resolved symbols, opened interactables, liberated markers, stage_stored, payoffs, interim story flags); saves happen only at Game State safe moments; Continue places from the save without on_map_reenter respawn and relocates a now-blocked position"
