  gdd: design/gdd/overworld-exploration-encounters.md
  requirement: "Load-time validation: OverworldConfig invariants I1-I18 at boot and in CI; validate_maps.gd checks every data criterion (no physics nodes by class, placement and safe zones, ordered bypass search, story encounter not routable round, beacon junction coverage, stage-raise rules, density and walk budgets, references)"
