  gdd: design/gdd/overworld-exploration-encounters.md
  requirement: "Maps are map_ records with scenes found by ID convention; critical-path legs end at an exit, a symbol or a camp and each ChapterFlow step names {map_id, leg_id}; map change swaps to a fresh OverworldMode instance with rollback; exits fire only on entering their rectangle and EntryPoints sit clear of them"
  created: 2026-10-23
  revised: ""
  status: active
