# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: content_file_discovery
    status: active
    api: ResourceLoader.list_directory(path)
    not: DirAccess directory listing
    adr: docs/architecture/adr-0001-content-data-storage-format.md
    reason: "Part of Godot's resource virtual filesystem; correct against both the editor and an exported build, where .tres files become binary + .remap companions that a raw DirAccess listing would surface incorrectly. Empirically verified present in Godot 4.7.2."
    referenced_by:
      - docs/architecture/adr-0001-content-data-storage-format.md
    added: 2026-10-21
    revised: ""
  - purpose: content_catalog_access
    status: active
    api: Godot autoload singleton (ContentCatalog)
    not: dependency injection into static factories
    adr: docs/architecture/adr-0001-content-data-storage-format.md
    reason: "Explicit, documented exception to the project's DI-over-singletons standard: the catalog is read-only after Ready, and every existing static factory (SquadSpecials.*, BureaucratiaRule.*, MegaCorpRule.*) is parameterless, so DI would require changing every already-shipped call site."
    referenced_by:
      - docs/architecture/adr-0001-content-data-storage-format.md
      - docs/architecture/adr-0004-content-boot-ordering.md   # access unchanged; only the load moves
    added: 2026-10-21
    revised: ""
  - purpose: mode_switching
    status: active
    api: "ModeHost child swap (PackedScene.instantiate + add_child / remove_child) under a persistent GameRoot main scene"
    not: "SceneTree.change_scene_to_file / change_scene_to_packed / reload_current_scene"
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    reason: "change_scene_* frees the current scene, which would destroy the Overworld instead of freezing it and take overlays and services with it; detaching keeps an exact restore. Detach state retention empirically verified on 4.7.2."
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
    revised: ""
  - purpose: menu_time_stop
    status: active
    api: "ModeHost.process_mode = PROCESS_MODE_DISABLED"
    not: "SceneTree.paused"
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    reason: "SceneTree.paused is global and would stop Audio Manager and overlays unless each opted out; disabling ModeHost stops only the mode subtree (Timers and Tweens verified on 4.7.2)."
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
      - docs/architecture/adr-0005-sprite-camera-presentation.md   # extended to shaders via mode_time
    added: 2026-10-21
    revised: ""
  - purpose: game_state_access
    status: active
    api: "GameStateMachine instance injected via setup() from GameRoot"
    not: "Godot autoload singleton"
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    reason: "Game State is mutable; Architecture Principle 4 limits autoloads to read-only state (ContentCatalog). Injection also lets every GDD acceptance criterion run headlessly against stubs."
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
    revised: ""
  - purpose: input_event_resolution
    status: active
    api: "InputResolver (RefCounted) fed raw InputEvents by InputSystem._input(); own binding table on physical_keycode / JoyButton / JoyAxis"
    not: "InputMap actions + Input.is_action_* / Input.get_vector() polling"
    adr: docs/architecture/adr-0003-input-system.md
    reason: "Input merges devices and cannot express the GDD's held-until-all-release, d-pad-wins-ties, fresh-press-after-focus and active-pad-only-disconnect rules; a pure resolver keeps every acceptance criterion headless with no global InputMap."
    referenced_by:
      - docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
    revised: ""
  - purpose: gui_keyboard_navigation
    status: active
    api: "Built-in ui_* navigation actions stripped of device events (InputMap.action_erase_events in InputSystem._enter_tree); routed actions re-injected via Input.parse_input_event(InputEventAction ui_*), focus-bounded and press+release atomic"
    not: "Device-bound ui_* actions driving Control focus natively"
    adr: docs/architecture/adr-0003-input-system.md
    reason: "Native ui_* navigation reads devices directly and would bypass Game State's input lock; re-injection keeps native focus/Button/ItemList behaviour. Verified on 4.7.2."
    referenced_by:
      - docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
    revised: ""
  - purpose: content_load_entry
    status: active
    api: "ContentBootstrap.run(catalog: ContentCatalogService) from GameRoot._enter_tree() (also harness scenes' _enter_tree() and validate-content.gd's _initialize()); idempotent"
    not: "ContentCatalog autoload _ready() calling load_all()"
    adr: docs/architecture/adr-0004-content-boot-ordering.md
    reason: "Registrants must run before the Validating phase; measured on 4.7.2, an autoload's _ready() runs after the main scene's _enter_tree(), so the original premise did not hold."
    referenced_by:
      - docs/architecture/adr-0004-content-boot-ordering.md
      - docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
    revised: ""
  - purpose: sprite_rendering
    status: active
    api: "AnimatedSprite3D (pixel_size = 1/pixels_per_unit) with a per-sprite ShaderMaterial override; the shader owns frame_tex (fed on frame_changed), Y-locked billboard in vertex() and ALPHA_SCISSOR_THRESHOLD"
    not: "Relying on SpriteBase3D node properties (texture_filter, alpha_cut, billboard) while an override is set; 2D CanvasLayer sprites over 3D; SubViewport compositing"
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    reason: "On 4.7.2 an override bypasses SpriteBase3D's generated material (verified), and billboard/alpha_scissor render modes are invalid; sprites must stay lit inside the diorama."
    referenced_by:
      - docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
    revised: ""
  - purpose: presentation_stage_lookup
    status: active
    api: "Group &\"active_diorama_stage\" (at most one in-tree member by ADR-0002's one-mode guarantee), read only by PresentationDirector and only on mode_entered"
    not: "A stage registry autoload, or any other system querying the group"
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    reason: "Stateless, read-only soft global bounded to one reader; detached modes leave the group automatically. Registered so the pattern is not copied for other lookups."
    referenced_by:
      - docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
    revised: ""
  - purpose: menu_ambient_freeze
    status: active
    api: "Global shader uniform mode_time (set each frame by PresentationDirector from GameStateMachine.mode_time) + DioramaStage.set_ambient_paused() for particles on Menu open/close"
    not: "Shader TIME in world shaders; SceneTree.paused"
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    reason: "ModeHost disable (ADR-0002) stops nodes but not shader TIME; mode_time stops under the Menu. Global uniform set at runtime verified on 4.7.2."
    referenced_by:
      - docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
    revised: ""
  - purpose: battle_replay_clock
    status: active
    api: "BattleReplayController.advance(delta) called from the Battle mode's _process with mode-time delta: clamp to dt_max, step the entry in progress (scaled wind-up or HOLD clock; unscaled post-impact clock), release markers, start the next entry. Leftover dt is dropped at every event; at most one timed entry finishes per call. Presentation reads get_windup_progress() / get_post_impact_time() / get_hold_time(), never its own timers"
    not: "Timer, Tween, SceneTree.create_timer or await on real time inside the controller"
    adr: docs/architecture/adr-0006-battle-replay-ownership.md
    reason: "Keeps the controller RefCounted and headless (tests drive advance() with chosen deltas, no wall-clock wait), and freezes the replay under the Menu because ADR-0002 disables ModeHost processing."
    referenced_by:
      - docs/architecture/adr-0006-battle-replay-ownership.md
    added: 2026-10-21
    revised: "2026-10-22"

