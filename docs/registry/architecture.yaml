# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: content_vocabulary_registration
    status: active
    pattern: direct_call
    # old producer (2026-10-21): "Turn Battle System, Faction Rule Modifiers (each registers its own vocabulary)"
    producer: "Turn Battle System, Faction Rule Modifiers (each owns its vocabulary), invoked via ContentBootstrap.run() before load_all() (ADR-0004)"
    consumers:
      - content-catalog
    adr: docs/architecture/adr-0001-content-data-storage-format.md
    signal_signature: "ContentCatalog.register_known_effect_types(system: StringName, types: PackedStringArray) -> void, called before load_all()'s Validating phase"
    referenced_by:
      - docs/architecture/adr-0001-content-data-storage-format.md
      - docs/architecture/adr-0004-content-boot-ordering.md
    added: 2026-10-21
    revised: "2026-10-21"
  - contract: content_record_validation
    status: active
    pattern: direct_call
    producer: "record-type owners (Input System today), invoked via ContentBootstrap.run()"
    consumers:
      - content-catalog
    adr: docs/architecture/adr-0004-content-boot-ordering.md
    signal_signature: "ContentCatalog.register_record_validator(type: StringName, validator: Callable) -> void; validator(record: Resource) -> PackedStringArray (pure, empty = valid); rejected once load_all() starts"
    referenced_by:
      - docs/architecture/adr-0004-content-boot-ordering.md
      - docs/architecture/adr-0003-input-system.md
      - docs/architecture/adr-0005-sprite-camera-presentation.md   # sprite_set_exists for character/enemy
    added: 2026-10-21
    revised: ""
  - contract: stage_profile_request
    status: active
    pattern: signal
    producer: "modes (via DioramaStage.request_profile)"
    consumers:
      - sprite-camera-presentation
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    signal_signature: "DioramaStage.profile_requested(profile_id: StringName); PresentationDirector then calls stage.apply_profile(profile, blend_time) (blend_time = 0 on mode_entered); modes never write light/environment properties"
    referenced_by:
      - docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
    revised: ""
  - contract: input_prompt_facade
    status: active
    pattern: direct_call
    producer: ui-framework
    consumers:
      - modes-and-overlays
    adr: docs/architecture/adr-0003-input-system.md
    signal_signature: "Read-only facade on the UI Framework service exposing active device kind, pad style and pointer events to widgets; the InputResolver reference never leaves the service"
    referenced_by:
      - docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
    revised: ""
  - contract: game_state_announcements
    status: active
    pattern: signal
    producer: game-state
    consumers:
      - sprite-camera-presentation
      - audio-manager
      - ui-framework
      - overworld
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    signal_signature: "transition_started(from, to), mode_exited(from), mode_entered(to), transition_finished(to), overlay_opened(kind), overlay_closed(kind) on GameStateMachine; fixed order; consumers never poll"
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
      - docs/architecture/adr-0005-sprite-camera-presentation.md   # PresentationDirector: mode_entered + Menu overlay
    added: 2026-10-21
    revised: ""
  - contract: action_source
    status: active
    pattern: signal
    producer: input-system
    consumers:
      - game-state
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    signal_signature: "Contract, not a base class: signals action_pressed(action: StringName), action_released(action: StringName), focus_lost(), device_lost(); func get_move_vector() -> Vector2. Input ADR conforms directly or via an adapter in GameRoot"
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
      - docs/architecture/adr-0003-input-system.md   # InputResolver satisfies it directly; nav_* steps arrive as action_pressed
    added: 2026-10-21
    revised: ""
  - contract: transition_presenter
    status: active
    pattern: direct_call
    producer: game-state
    consumers:
      - ui-framework
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    signal_signature: "TransitionPresenter.play_out(type: StringName, duration: float) / play_in(type, duration); fire-and-forget, the machine's tick timing is authoritative"
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
    revised: ""
  - contract: battle_replay_gating
    status: active
    pattern: signal
    producer: battle-replay-controller
    consumers:
      - ui-framework          # BattleHud: command menu, HP bars, result
      - battle-mode           # reports the outcome to Game State on battle_ended_after_replay
      - sprite-camera-presentation   # beat and hold signals; frames from the controller's clocks
      - audio-manager                # hit sound on beat_impact
    adr: docs/architecture/adr-0006-battle-replay-ownership.md
    signal_signature: "BattleReplayController: replay_started(), replay_finished(), replay_cancelled(), latch_changed(latched: bool), hold_started(kind: HoldKind, boss: Combatant), hold_finished(kind: HoldKind), beat_started(plan: BeatPlan), beat_impact(plan: BeatPlan), beat_finished(plan: BeatPlan), round_advanced_after_replay(round_number: int), turn_started_after_replay(combatant: Combatant), battle_ended_after_replay(won: bool); markers released in BattleCore emission order, each only after every earlier timed entry (reveal gate, takeover hold, beat) has finished; replay_finished precedes the marker that ends a replay"
    referenced_by:
      - docs/architecture/adr-0006-battle-replay-ownership.md
    added: 2026-10-21
    revised: "2026-10-22"

