# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-10-21"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: content_catalog_records
    status: active
    owner_system: content-catalog
    adr: docs/architecture/adr-0001-content-data-storage-format.md
    interface: "ContentCatalog.get_record(type, id) / has_record / all_records / resolve_alias (read-only after Ready)"
    write_access: content-catalog-only
    referenced_by:
      - docs/architecture/adr-0001-content-data-storage-format.md
      - docs/architecture/adr-0002-game-state-scene-flow.md   # Boot reads state; descriptor validation uses has_record
    added: 2026-10-21
    revised: ""
  - state: game_mode_and_overlay_stack
    status: active
    owner_system: game-state
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    interface: "GameStateMachine.current_mode / overlay_stack / phase (read-only); changed only via request_transition / open_overlay / close_overlay / request_quit"
    write_access: game-state-only
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
    revised: ""
  - state: battle_start_snapshot
    status: active
    owner_system: game-state
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    interface: "Opaque handle: game-state holds it; Battle mode creates it via capture_start_snapshot() and owns its contents; restored via restore_start_snapshot(handle) on Retry"
    write_access: battle-mode-creates-contents, game-state-holds-handle
    referenced_by:
      - docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
    revised: ""
  - state: input_device_state
    status: active
    owner_system: input-system
    adr: docs/architecture/adr-0003-input-system.md
    interface: "InputResolver: held set, move vector, active device/pad style, focus; read via its signals and get_move_vector() by game-state, and via the UI Framework service's read-only prompt/pointer facade by widgets"
    write_access: input-system-only
    referenced_by:
      - docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
    revised: ""
  - state: battle_replay_queue_and_display_hp
    status: active
    owner_system: battle-replay-controller
    adr: docs/architecture/adr-0006-battle-replay-ownership.md
    interface: "BattleReplayController.get_display(combatant) -> CombatantDisplay (hp, mp, status), get_display_hp(), get_state(), is_replaying(), is_latched(), get_windup_progress(), get_post_impact_time(), get_hold_time(), get_boss_combatant() (read-only); queue, display snapshots and clocks are private; changed only by advance(delta), enqueue_reveal_gate(), open_reveal_gate(), enqueue_takeover(), request_latch(), clear_latch(), set_speed_settings(), cancel_pending_replay(), resync(), dispose()"
    write_access: battle-replay-controller-only
    referenced_by:
      - docs/architecture/adr-0006-battle-replay-ownership.md
    added: 2026-10-21
    revised: "2026-10-22"

