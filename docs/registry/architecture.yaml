# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_resource_reference_in_content_records
    status: active
    description: "A Content Data Definitions record (Resource subclass under data/) must never @export a field typed as another Resource subclass. Cross-references must be plain String/PackedStringArray ID fields."
    why: "A direct Resource reference reintroduces file-path coupling through Godot's .tres ExtResource mechanism, violating the GDD's Rule 3 (references by ID only) and defeating the whole point of ID-based indirection (stable IDs across refactors, save-file compatibility)."
    adr: docs/architecture/adr-0001-content-data-storage-format.md
    added: 2026-10-21
  - pattern: scene_tree_change_scene
    status: active
    description: "No code may call SceneTree.change_scene_to_file(), change_scene_to_packed() or reload_current_scene(). GameRoot is the only main scene; modes swap under ModeHost."
    why: "Frees the current scene, destroying the frozen Overworld, the overlay stack and the services that Game State depends on."
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
  - pattern: scene_tree_paused_for_menu
    status: active
    description: "SceneTree.paused must not be used to stop mode time for the Menu or any overlay."
    why: "Global pause also stops Audio Manager and overlays; Game State disables ModeHost instead."
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
  - pattern: mutable_autoload_singleton
    status: active
    description: "No autoload may hold mutable game state. ContentCatalog (read-only after Ready, ADR-0001) is the only permitted autoload exception."
    why: "Architecture Principle 4; mutable globals defeat dependency injection and the stub-driven acceptance tests."
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
  - pattern: mode_direct_input_access
    status: active
    description: "Modes and overlays must not reference the Input System or connect to its signals; discrete actions arrive via handle_action(), movement via GameStateMachine.get_move_vector(self)."
    why: "Game State owns routing and the input lock (Input GDD rule 2); a mode reading Input directly bypasses the lock during transitions and overlays."
    adr: docs/architecture/adr-0002-game-state-scene-flow.md
    added: 2026-10-21
  - pattern: engine_input_outside_input_system
    status: active
    description: "No script except src/input/input_system.gd may override _input/_unhandled_input to read gameplay input, poll Input.*, or mutate InputMap. Sole exception: the UI Framework re-injection helper may call Input.parse_input_event() with a ui_* InputEventAction, focus-bounded and press-only."
    why: "A second reader of engine input bypasses the resolver's device rules and Game State's lock."
    adr: docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
  - pattern: device_zero_as_keyboard_mouse
    status: active
    description: "event.device == 0 must never be used to mean keyboard or mouse; use the event type or InputEvent.DEVICE_ID_KEYBOARD / DEVICE_ID_MOUSE."
    why: "Since Godot 4.7, keyboard/mouse report dedicated IDs (16/32 verified) and some joypads report device 0."
    adr: docs/architecture/adr-0003-input-system.md
    added: 2026-10-21
  - pattern: load_all_outside_bootstrap
    status: active
    description: "ContentCatalog.load_all() may be called only by ContentBootstrap.run(); ContentCatalog._ready() must not assign, clear or allocate catalog state."
    why: "Registrants must run before validation; the autoload's _ready() runs after the main scene's _enter_tree() on 4.7.2 and would erase a completed load."
    adr: docs/architecture/adr-0004-content-boot-ordering.md
    added: 2026-10-21
  - pattern: world_shader_time
    status: active
    description: "Spatial or canvas shaders used inside mode scenes must never read TIME; they read the global uniform mode_time. UI shaders outside ModeHost may use TIME."
    why: "TIME keeps running while the Menu is open, breaking Game State rule 10's frozen diorama."
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
  - pattern: shared_actor_material
    status: active
    description: "Actor sprites must never share one ShaderMaterial; each CharacterSprite owns its own instance and refreshes frame_tex on frame_changed/animation_changed."
    why: "A sampler cannot be an instance uniform, so a shared material shows the same frame on every sprite."
    adr: docs/architecture/adr-0005-sprite-camera-presentation.md
    added: 2026-10-21
  - pattern: direct_battlecore_turn_signal_listening
    status: active
    description: "BattleHud and the Battle mode must never connect to BattleCore.turn_started, round_advanced or battle_ended; they use BattleReplayController's *_after_replay signals and read HP, MP and status through get_display(). Under Game State the Battle mode never calls start_battle() with its default argument, or retry_battle()."
    why: "BattleCore emits these synchronously before any beat plays; listening directly opens the command menu, shows the result and reveals final HP ahead of the replay (sprite-camera-presentation.md rule 9)."
    adr: docs/architecture/adr-0006-battle-replay-ownership.md
    added: 2026-10-21

